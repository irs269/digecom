name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck et tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: digecom
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: digecom_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U digecom" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://digecom:ci-password@localhost:5432/digecom_ci?schema=public
      DATABASE_URL_TEST: postgresql://digecom:ci-password@localhost:5432/digecom_test?schema=public
      REDIS_URL: redis://localhost:6379/0
      REDIS_URL_TEST: redis://localhost:6379/1
      JWT_ACCESS_SECRET: secret-ci-uniquement-pour-les-tests-0123456789abcdef
      WEB_ORIGIN: http://localhost:3000
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ci-minio
      S3_SECRET_KEY: ci-minio-secret
    steps:
      - uses: actions/checkout@v4
      # MinIO (photos, preuves) : les services GitHub ne passent pas d'arguments, d'où docker run.
      - name: MinIO et buckets
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ci-minio -e MINIO_ROOT_PASSWORD=ci-minio-secret \
            chainguard/minio@sha256:869ca3178831d9f521ea02258a0f0d4fbc1e9f84302e707514e1f861b860865d server /data
          MC=chainguard/minio-client@sha256:7e80e77f8c949810d0eaead1120e28c63f913ff96ae7f78a8e4cd3c1e2f0623f
          docker run --rm --network host -e MC_HOST_local=http://ci-minio:ci-minio-secret@localhost:9000 $MC ready local
          docker run --rm --network host -e MC_HOST_local=http://ci-minio:ci-minio-secret@localhost:9000 $MC \
            mb --ignore-existing local/products local/proofs local/documents
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Échec si une dépendance a une vulnérabilité critique connue.
      - name: pnpm audit
        run: pnpm audit --prod --audit-level critical
      - run: pnpm --filter @digecom/shared build
      - run: pnpm --filter api exec prisma generate
      - run: pnpm lint
      - run: pnpm test

  e2e:
    name: Playwright (Docker Compose)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Préparer .env
        run: |
          cp .env.example .env
          sed -i "s|^JWT_ACCESS_SECRET=.*|JWT_ACCESS_SECRET=$(openssl rand -base64 48 | tr -d '\n')|" .env
      - name: Démarrer la stack
        run: docker compose up -d --build --wait api web
      - name: Migrations et seed
        run: |
          docker compose exec -T api pnpm --filter api migrate:deploy
          docker compose exec -T api pnpm --filter api seed
      - name: Playwright
        run: docker compose --profile e2e run --rm e2e
      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs --tail=200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  images:
    name: Images de production et scan Trivy
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
        target: [api-prod, api-migrate, web-prod]
    steps:
      - uses: actions/checkout@v4
      # Builder classique (sans buildx), comme sur le VPS.
      - name: Construire
        env:
          DOCKER_BUILDKIT: '0'
        run: |
          case "${{ matrix.target }}" in
            api-prod)    docker build -f apps/api/Dockerfile --target prod    -t img:ci . ;;
            api-migrate) docker build -f apps/api/Dockerfile --target migrate -t img:ci . ;;
            web-prod)    docker build -f apps/web/Dockerfile --target prod    -t img:ci . ;;
          esac
      # Échec si une vulnérabilité CRITIQUE corrigeable est présente.
      - name: Trivy
        if: matrix.target != 'api-migrate'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: img:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

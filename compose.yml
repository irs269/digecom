# Dig'eCom – environnement de développement entièrement dockerisé.
#   cp .env.example .env && make up && make migrate && make seed
# Web : http://localhost:3000 · API : http://localhost:4000 · Swagger : http://localhost:4000/api/docs
# MinIO : http://localhost:9001

name: ${COMPOSE_PROJECT_NAME:-digecom}

x-node-volumes: &node-volumes
  - .:/app
  - nm_root:/app/node_modules
  - nm_api:/app/apps/api/node_modules
  - nm_web:/app/apps/web/node_modules
  - nm_shared:/app/packages/shared/node_modules
  - nm_config:/app/packages/config/node_modules
  - pnpm_store:/pnpm/store
  # Sorties de compilation dans des volumes : le conteneur (uid 1000) n'a pas forcément le
  # droit d'écrire dans le dépôt monté (CI Linux, autre uid).
  - api_dist:/app/apps/api/dist

x-node-env: &node-env
  npm_config_store_dir: /pnpm/store
  # Surveillance des fichiers par polling (montage depuis Windows/macOS).
  CHOKIDAR_USEPOLLING: 'true'
  WATCHPACK_POLLING: 'true'
  TSC_WATCHFILE: DynamicPriorityPolling
  TSC_WATCHDIRECTORY: DynamicPriorityPolling

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-digecom}
      TZ: UTC
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-init-test-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Images MinIO : les images minio/* ont été retirées de Docker Hub ; on utilise les builds
  # Chainguard, épinglés par digest (pas de shell dans ces images).
  minio:
    image: chainguard/minio@sha256:869ca3178831d9f521ea02258a0f0d4fbc1e9f84302e707514e1f861b860865d
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER manquant dans .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD manquant dans .env}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data

  # Attend que MinIO réponde (mc ready réessaie jusqu'à disponibilité).
  minio-ready:
    image: &mc-image chainguard/minio-client@sha256:7e80e77f8c949810d0eaead1120e28c63f913ff96ae7f78a8e4cd3c1e2f0623f
    depends_on: [minio]
    environment: &mc-env
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    command: ['ready', 'local']
    restart: 'no'

  # Crée les buckets products, proofs, documents puis s'arrête.
  minio-init:
    image: *mc-image
    depends_on:
      minio-ready:
        condition: service_completed_successfully
    environment: *mc-env
    command: ['mb', '--ignore-existing', 'local/products', 'local/proofs', 'local/documents']
    restart: 'no'

  # Installe les dépendances Linux dans les volumes node_modules (une fois par `make up`).
  deps:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: base
    user: root
    working_dir: /app
    environment:
      <<: *node-env
    volumes:
      - .:/app
      - nm_root:/app/node_modules
      - nm_api:/app/apps/api/node_modules
      - nm_web:/app/apps/web/node_modules
      - nm_shared:/app/packages/shared/node_modules
      - nm_config:/app/packages/config/node_modules
      - pnpm_store:/pnpm/store
      - web_next:/app/apps/web/.next
      - api_dist:/app/apps/api/dist
    # Les volumes nommés sont créés par root : on les rend à l'utilisateur `node` (uid 1000).
    command:
      [
        'sh',
        '-c',
        'sh docker/deps.sh && chown -R 1000:1000 /app/node_modules /app/apps/api/node_modules /app/apps/web/node_modules /app/packages/shared/node_modules /app/packages/config/node_modules /app/apps/web/.next /app/apps/api/dist /pnpm/store',
      ]
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      <<: *node-env
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-digecom}?schema=public
      DATABASE_URL_TEST: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-digecom}_test?schema=public
      REDIS_URL: redis://redis:6379/0
      REDIS_URL_TEST: redis://redis:6379/1
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - '${API_PORT:-4000}:4000'
    volumes: *node-volumes
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/health > /dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_started
    environment:
      <<: *node-env
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      API_INTERNAL_URL: http://api:4000
    ports:
      - '${WEB_PORT:-3000}:3000'
    volumes:
      - .:/app
      - nm_root:/app/node_modules
      - nm_api:/app/apps/api/node_modules
      - nm_web:/app/apps/web/node_modules
      - nm_shared:/app/packages/shared/node_modules
      - nm_config:/app/packages/config/node_modules
      - pnpm_store:/pnpm/store
      - web_next:/app/apps/web/.next

  # Web en build de production pour les tests Playwright (rapide et fiable, contrairement au
  # mode dev qui compile chaque page à la première visite). Réutilise les dépendances installées.
  web-e2e:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    profiles: ['e2e']
    # Service de test uniquement : root pour écrire dans son volume .next dédié.
    user: root
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: /api
      API_INTERNAL_URL: http://api:4000
    volumes:
      - .:/app
      - nm_root:/app/node_modules
      - nm_api:/app/apps/api/node_modules
      - nm_web:/app/apps/web/node_modules
      - nm_shared:/app/packages/shared/node_modules
      - nm_config:/app/packages/config/node_modules
      - pnpm_store:/pnpm/store
      - web_next_e2e:/app/apps/web/.next
    command:
      [
        'sh',
        '-c',
        'pnpm --filter web build && pnpm --filter web exec next start -H 0.0.0.0 -p 3000',
      ]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/connexion > /dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  # Tests Playwright (make e2e) : navigateur headless contre le web en build de production.
  e2e:
    image: mcr.microsoft.com/playwright:v1.52.0-noble
    profiles: ['e2e']
    working_dir: /app
    depends_on:
      web-e2e:
        condition: service_healthy
    environment:
      E2E_BASE_URL: http://web-e2e:3000
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD}
      CI: 'true'
    volumes: *node-volumes
    command: ['sh', '-c', 'corepack enable && pnpm --filter web e2e']

volumes:
  pg_data:
  redis_data:
  minio_data:
  nm_root:
  nm_api:
  nm_web:
  nm_shared:
  nm_config:
  pnpm_store:
  web_next:
  api_dist:
  web_next_e2e:

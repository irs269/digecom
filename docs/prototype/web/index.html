<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dig'eCom – Back-office complet</title>
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F5FC}
a{color:#0B2FE0}a:hover{color:#071C99}
button,input,select{font-family:inherit}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/plain" id="tpl">
<div style="font-family: 'Poppins', system-ui, sans-serif; color: #0F1535; background: #F3F5FC; min-height: 100vh">


<sc-if value="{{notLogged}}" hint-placeholder-val="{{false}}">
  <div style="min-height: 100vh; background: #0B2FE0; color: #FFFFFF; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 20px; box-sizing: border-box">
    <div aria-hidden="true" style="position: absolute; top: -120px; right: -120px; width: 360px; height: 360px; border-radius: 999px; background: #FFA500"></div>
    <div aria-hidden="true" style="position: absolute; bottom: -160px; left: -100px; width: 420px; height: 420px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,0.5)"></div>
    <div style="position: relative; width: 100%; max-width: 1040px; display: flex; flex-direction: column; gap: 28px">
      <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap">
        <img src="logo.jpg" alt="Logo Dig'eCom Agency" style="width: 76px; height: 76px; border-radius: 999px; object-fit: cover; border: 3px solid #FFFFFF">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.5px">Dig'eCom – Back-office</h1>
          <span style="font-size: 15px; color: #DCE3FF">Choisis un profil pour voir l'application avec ses droits d'accès.</span>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px">
        <sc-for list="{{roleCards}}" as="rc" hint-placeholder-count="8">
          <button type="button" onClick="{{rc.login}}" style="text-align: left; background: #FFFFFF; color: #0F1535; border: 0; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; min-height: 132px">
            <span style="font-size: 16px; font-weight: 800; color: #0B2FE0">{{rc.nom}}</span>
            <span style="font-size: 14px; font-weight: 600">{{rc.personne}}</span>
            <span style="font-size: 12px; color: #4A5275">{{rc.desc}}</span>
            <span style="margin-top: auto; align-self: flex-start; font-size: 12px; font-weight: 600; background: #FFF0D1; color: #7A4100; padding: 3px 10px; border-radius: 999px">{{rc.scope}} · {{rc.nbMods}} modules</span>
          </button>
        </sc-for>
      </div>
      <span style="font-size: 12px; color: #DCE3FF">Prototype : les e-commerçants et les livreurs utilisent l'application mobile. Toutes les données sont fictives.</span>
    </div>
  </div>
</sc-if>


<sc-if value="{{logged}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-wrap: wrap; align-items: stretch; min-height: 100vh">

  <aside style="flex: 1 1 250px; max-width: 100%; background: #0B2FE0; color: #FFFFFF; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 0 8px">
      <img src="logo.jpg" alt="Logo Dig'eCom Agency" style="width: 50px; height: 50px; border-radius: 14px; object-fit: cover; border: 2px solid #FFFFFF">
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 20px; font-weight: 800; letter-spacing: -0.3px">Dig'eCom</span>
        <span style="font-size: 12px; color: #DCE3FF">Back-office</span>
      </div>
    </div>
    <nav aria-label="Menu principal" style="display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="8">
        <sc-if value="{{n.active}}" hint-placeholder-val="{{false}}">
          <button type="button" onClick="{{n.go}}" style="display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; min-height: 44px; padding: 10px 14px; border: 0; border-radius: 12px; background: #FFA500; color: #0A1450; font-size: 14px; font-weight: 700; cursor: pointer"><span>{{n.label}}</span><sc-if value="{{n.ro}}" hint-placeholder-val="{{false}}"><span style="font-size: 10px; font-weight: 700; background: #0A1450; color: #FFFFFF; padding: 2px 6px; border-radius: 6px">LECTURE</span></sc-if></button>
        </sc-if>
        <sc-if value="{{n.idle}}" hint-placeholder-val="{{true}}">
          <button type="button" onClick="{{n.go}}" style="display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; min-height: 44px; padding: 10px 14px; border: 0; border-radius: 12px; background: transparent; color: #FFFFFF; font-size: 14px; font-weight: 500; cursor: pointer"><span>{{n.label}}</span><sc-if value="{{n.ro}}" hint-placeholder-val="{{false}}"><span style="font-size: 10px; font-weight: 700; background: #0A26B8; color: #DCE3FF; padding: 2px 6px; border-radius: 6px">LECTURE</span></sc-if></button>
        </sc-if>
      </sc-for>
    </nav>
    <div style="margin-top: auto; background: #0A26B8; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; color: #DCE3FF">Connecté en tant que</span>
      <span style="font-size: 14px; font-weight: 700">{{me.personne}}</span>
      <span style="font-size: 12px; color: #DCE3FF">{{me.nom}} · {{me.scope}}</span>
      <button type="button" onClick="{{logout}}" style="margin-top: 6px; min-height: 40px; border: 1px solid #DCE3FF; border-radius: 10px; background: transparent; color: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer">Changer de profil</button>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; padding: 28px 32px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">

    <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
          <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.5px">{{pageTitle}}</h1>
          <sc-if value="{{readOnly}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 700; background: #E6EBFF; color: #0A23B8; padding: 4px 10px; border-radius: 999px">Lecture seule pour ton profil</span></sc-if>
        </div>
        <span style="font-size: 14px; color: #4A5275">{{pageSub}}</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
        <sc-if value="{{canFilter}}" hint-placeholder-val="{{true}}">
          <div role="group" aria-label="Filtrer par île" style="display: flex; flex-wrap: wrap; gap: 4px; background: #FFFFFF; border: 1px solid #E1E5F2; border-radius: 999px; padding: 4px">
            <sc-for list="{{iles}}" as="i" hint-placeholder-count="4">
              <sc-if value="{{i.active}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{i.go}}" style="min-height: 40px; padding: 8px 16px; border: 0; border-radius: 999px; background: #0B2FE0; color: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer">{{i.label}}</button></sc-if>
              <sc-if value="{{i.idle}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{i.go}}" style="min-height: 40px; padding: 8px 16px; border: 0; border-radius: 999px; background: transparent; color: #0F1535; font-size: 13px; font-weight: 500; cursor: pointer">{{i.label}}</button></sc-if>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{scopeLocked}}" hint-placeholder-val="{{false}}">
          <span style="font-size: 13px; font-weight: 600; background: #FFFFFF; border: 1px solid #E1E5F2; padding: 10px 16px; border-radius: 999px">Périmètre : {{scopeLabel}}</span>
        </sc-if>
      </div>
    </header>

    <sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
      <div role="status" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; background: #DDF5E5; color: #14532D; border-radius: 14px; padding: 12px 16px; font-size: 14px; font-weight: 600"><span>{{toast}}</span><button type="button" onClick="{{clearToast}}" aria-label="Fermer le message" style="min-width: 36px; min-height: 36px; border: 0; background: transparent; color: #14532D; font-size: 18px; cursor: pointer">×</button></div>
    </sc-if>

    
    <sc-if value="{{is.dash}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 24px">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px">
          <sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
            <sc-if value="{{k.blue}}" hint-placeholder-val="{{false}}">
              <div style="background: #0B2FE0; color: #FFFFFF; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; color: #DCE3FF">{{k.label}}</span><span style="font-size: 26px; font-weight: 800; letter-spacing: -0.5px">{{k.value}}</span><span style="font-size: 12px; color: #DCE3FF">{{k.sub}}</span></div>
            </sc-if>
            <sc-if value="{{k.white}}" hint-placeholder-val="{{true}}">
              <div style="background: #FFFFFF; border: 1px solid #E1E5F2; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; color: #4A5275">{{k.label}}</span><span style="font-size: 26px; font-weight: 800; letter-spacing: -0.5px">{{k.value}}</span><span style="font-size: 12px; color: #4A5275">{{k.sub}}</span></div>
            </sc-if>
            <sc-if value="{{k.orange}}" hint-placeholder-val="{{false}}">
              <div style="background: #FFA500; color: #0A1450; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 500">{{k.label}}</span><span style="font-size: 26px; font-weight: 800; letter-spacing: -0.5px">{{k.value}}</span><span style="font-size: 12px; font-weight: 500">{{k.sub}}</span></div>
            </sc-if>
          </sc-for>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
          <sc-if value="{{showRecent}}" hint-placeholder-val="{{true}}">
            <section style="flex: 2 1 520px; min-width: 0; background: #FFFFFF; border: 1px solid #E1E5F2; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
              <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
                <h2 style="margin: 0; font-size: 18px; font-weight: 700">{{recentTitle}}</h2>
                <button type="button" onClick="{{goCmd}}" style="min-height: 40px; padding: 8px 14px; border: 1px solid #0B2FE0; border-radius: 10px; background: #FFFFFF; color: #0B2FE0; font-size: 13px; font-weight: 600; cursor: pointer">Voir les commandes</button>
              </div>
              <div style="overflow-x: auto">
                <table style="width: 100%; border-collapse: collapse">
                  <thead><tr>
                    <th style="text-align: left; font-size: 12px; font-weight: 600; color: #4A5275; padding: 10px 12px; border-bottom: 1px solid #E1E5F2">N°</th>
                    <th style="text-align: left; font-size: 12px; font-weight: 600; color: #4A5275; padding: 10px 12px; border-bottom: 1px solid #E1E5F2">Vendeur</th>
                    <th style="text-align: left; font-size: 12px; font-weight: 600; color: #4A5275; padding: 10px 12px; border-bottom: 1px solid #E1E5F2">Produit</th>
                    <th style="text-align: left; font-size: 12px; font-weight: 600; color: #4A5275; padding: 10px 12px; border-bottom: 1px solid #E1E5F2">Île</th>
                    <th style="text-align: left; font-size: 12px; font-weight: 600; color: #4A5275; padding: 10px 12px; border-bottom: 1px solid #E1E5F2">Statut</th>
                  </tr></thead>
                  <tbody>
                    <sc-for list="{{recent}}" as="r" hint-placeholder-count="5">
                      <tr>
                        <td style="padding: 12px; font-size: 14px; font-weight: 600; border-bottom: 1px solid #EEF1F8; white-space: nowrap">#{{r.id}}</td>
                        <td style="padding: 12px; font-size: 14px; border-bottom: 1px solid #EEF1F8; white-space: nowrap">{{r.ecom}}</td>
                        <td style="padding: 12px; font-size: 14px; border-bottom: 1px solid #EEF1F8; white-space: nowrap">{{r.produit}}</td>
                        <td style="padding: 12px; font-size: 14px; border-bottom: 1px solid #EEF1F8; white-space: nowrap">{{r.ileNom}}</td>
                        <td style="padding: 12px; border-bottom: 1px solid #EEF1F8; white-space: nowrap">
                          <sc-if value="{{r.tB}}" hint-placeholder-val="{{false}}"><span style="display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #E6EBFF; color: #0A23B8">{{r.status}}</span></sc-if>
                          <sc-if value="{{r.tO}}" hint-placeholder-val="{{false}}"><span style="display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #FFF0D1; color: #7A4100">{{r.status}}</span></sc-if>
                          <sc-if value="{{r.tG}}" hint-placeholder-val="{{false}}"><span style="display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #DDF5E5; color: #14532D">{{r.status}}</span></sc-if>
                          <sc-if value="{{r.tR}}" hint-placeholder-val="{{false}}"><span style="display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #FDE2E2; color: #991B1B">{{r.status}}</span></sc-if>
                        </td>
                      </tr>
                    </sc-for>
                  </tbody>
                </table>
              </div>
            </section>
          </sc-if>

          <div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
            <section style="background: #FFFFFF; border: 1px solid #E1E5F2; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
              <h2 style="margin: 0; font-size: 18px; font-weight: 700">À traiter</h2>
              <sc-for list="{{todo}}" as="t" hint-placeholder-count="4">
                <sc-if value="{{t.alert}}" hint-placeholder-val="{{false}}">
                  <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px; background: #FDE2E2; border-radius: 12px"><span style="font-size: 14px; color: #7F1D1D">{{t.label}}</span><span style="font-size: 18px; font-weight: 800; color: #991B1B">{{t.n}}</span></div>
                </sc-if>
                <sc-if value="{{t.normal}}" hint-placeholder-val="{{true}}">
                  <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px; background: #F3F5FC; border-radius: 12px"><span style="font-size: 14px">{{t.label}}</span><span style="font-size: 18px; font-weight: 800; color: #0B2FE0">{{t.n}}</span></div>
                </sc-if>
              </sc-for>
            </section>

            <sc-if value="{{showCalc}}" hint-placeholder-val="{{false}}">
              <section style="background: #FFFFFF; border: 1px solid #E1E5F2; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
                <h2 style="margin: 0; font-size: 18px; font-weight: 700">Calcul d'une vente de référence</h2>
                <div style="display: flex; justify-content: space-between; font-size: 14px"><span>Prix de vente final</span><strong>12 500 KMF</strong></div>
                <div style="display: flex; justify-content: space-between; font-size: 14px; color: #4A5275"><span>Coût d'approvisionnement</span><span>750 KMF</span></div>
                <div style="display: flex; justify-content: space-between; font-size: 14px; color: #4A5275"><span>Part e-commerçant</span><span>7 500 KMF</span></div>
                <div style="display: flex; justify-content: space-between; font-size: 14px; color: #4A5275"><span>Part commerciale Dig'eCom</span><span>5 000 KMF</span></div>
                <div style="display: flex; justify-content: space-between; font-size: 14px; color: #4A5275"><span>Taxe Dig'eCom</span><span>− 500 KMF</span></div>
                <div style="height: 1px; background: #E1E5F2"></div>
                <div style="display: flex; justify-content: space-between; font-size: 15px"><span style="font-weight: 600">Marge Dig'eCom</span><strong style="color: #0B2FE0">3 750 KMF</strong></div>
                <div style="display: flex; justify-content: space-between; font-size: 15px"><span style="font-weight: 600">Net e-commerçant</span><strong style="color: #0B2FE0">7 000 KMF</strong></div>
              </section>
            </sc-if>
          </div>
        </div>
      </div>
    </sc-if>

    
    <sc-if value="{{is.cmd}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
        <section style="flex: 2 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #E1E5F2; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
          <h2 style="margin: 0; font-size: 18px; font-weight: 700">{{cmdTitle}}</h2>
          <div style="overflow-x: auto">
            <table style="width: 100%; border-collapse: collapse">
              <thead><tr>
                <th style="text-align: left; font-size: 12px; font-weight: 600; color: #4A5275; padding: 10px 12px; border-bottom: 1px solid #E1E5F2">N°</th>
                <th style="text-align: left; font-size: 12px; font-weight: 600; color: #4A5275; padding: 10px 12px; border-bottom: 1px solid #E1E5F2">Date</th>
                <th style="text-align: left; font-size: 12px; font-weight: 600; color: #4A5275; padding: 10px 12px; border-bottom: 1px solid #E1E5F2">Vendeur</th>
                <th style="text-align: left; font-size: 12px; font-weight: 600; color: #4A5275; padding: 10px 12px; border-bottom: 1px solid #E1E5F2">Produit</th>
                <th style="text-align: left; font-size: 12px; font-weight: 600; color: #4A5275; padding: 10px 12px; border-bottom: 1px solid #E1E5F2">Mode de remise</th>
                <th style="text-align: left; font-size: 12px; font-weight: 600; color: #4A5275; padding: 10px 12px; border-bottom: 1px solid #E1E5F2">Île</th>
                <th style="text-align: right; font-size: 12px; font-weight: 600; color: #4A5275; padding: 10px 12px; border-bottom: 1px solid #E1E5F2">Prix (KMF)</th>
                <th style="text-align: left; font-size: 12px; font-weight: 600; color: #4A5275; padding: 10px 12px; border-bottom: 1px solid #E1E5F2">Statut</th>
              </tr></thead>
              <tbody>
                <sc-for list="{{orders}}" as="r" hint-placeholder-count="8">
                  <tr>
                    <td style="padding: 8px 12px; border-bottom: 1px solid #EEF1F8; white-space: nowrap">
                      <sc-if value="{{r.selected}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{r.pick}}" style="min-height: 36px; padding: 6px 10px; border: 0; border-radius: 8px; background: #0B2FE0; color: #FFFFFF; font-size: 13px; font-weight: 700; cursor: pointer">#{{r.id}}</button></sc-if>
                      <sc-if value="{{r.notSelected}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{r.pick}}" style="min-height: 36px; padding: 6px 10px; border: 1px solid #C9D2F5; border-radius: 8px; background: #FFFFFF; color: #0B2FE0; font-size: 13px; font-weight: 700; cursor: pointer">#{{r.id}}</button></sc-if>
                    </td>
                    <td style="padding: 12px; font-size: 13px; color: #4A5275; border-bottom: 1px solid #EEF1F8; white-space: nowrap">{{r.date}}</td>
                    <td style="padding: 12px; font-size: 14px; border-bottom: 1px solid #EEF1F8; white-space: nowrap">{{r.ecom}}</td>
                    <td style="padding: 12px; font-size: 14px; border-bottom: 1px solid #EEF1F8; white-space: nowrap">{{r.produit}}</td>
                    <td style="padding: 12px; font-size: 13px; border-bottom: 1px solid #EEF1F8; white-space: nowrap">{{r.modeNom}}</td>
                    <td style="padding: 12px; font-size: 13px; border-bottom: 1px solid #EEF1F8; white-space: nowrap">{{r.ileNom}}</td>
                    <td style="padding: 12px; font-size: 14px; text-align: right; border-bottom: 1px solid #EEF1F8; white-space: nowrap">{{r.prixTxt}}</td>
                    <td style="padding: 12px; border-bottom: 1px solid #EEF1F8; white-space: nowrap">
                      <sc-if value="{{r.tB}}" hint-placeholder-val="{{false}}"><span style="display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #E6EBFF; color: #0A23B8">{{r.status}}</span></sc-if>
                      <sc-if value="{{r.tO}}" hint-placeholder-val="{{false}}"><span style="display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #FFF0D1; color: #7A4100">{{r.status}}</span></sc-if>
                      <sc-if value="{{r.tG}}" hint-placeholder-val="{{false}}"><span style="display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #DDF5E5; color: #14532D">{{r.status}}</span></sc-if>
                      <sc-if value="{{r.tR}}" hint-placeholder-val="{{false}}"><span style="display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #FDE2E2; color: #991B1B">{{r.status}}</span></sc-if>
                    </td>
                  </tr>
                </sc-for>
              </tbody>
            </table>
          </div>
        </section>

        <sc-if value="{{hasSel}}" hint-placeholder-val="{{true}}">
          <section style="flex: 1 1 320px; min-width: 0; background: #FFFFFF; border: 1px solid #E1E5F2; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
            <div style="display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 12px; font-weight: 600; color: #0B2FE0">COMMANDE #{{sel.id}}</span>
              <h2 style="margin: 0; font-size: 20px; font-weight: 700">{{sel.produit}}</h2>
              <span style="font-size: 14px; color: #4A5275">{{sel.prixTxt}} KMF · {{sel.modeNom}} · {{sel.ileNom}}</span>
            </div>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; font-size: 13px">
              <div style="display: flex; flex-direction: column; gap: 2px"><span style="color: #4A5275">E-commerçant</span><strong>{{sel.ecom}}</strong></div>
